<title>Provador Dreamz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,0..100;1,9..144,400..900,0..100&family=Manrope:wght@400;600;700;800&family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Laboratório: 10 jeitos de mostrar as roupas da Dreamz, uma por aba. Visual da noite (preto → marinho), igual ao site. */
:root{color-scheme:dark;--bg:#05060c;--fg:#FEFAE2;--muted:rgba(254,250,226,.62);--line:rgba(254,250,226,.16);--accent:#8AC4FE;--marinho:#283456;--lavanda:#7690D4;--creme:#FEFAE2;
  --f-d:"Fraunces",Georgia,serif;--f-b:"Manrope",Arial,sans-serif;--f-m:"Space Mono",monospace;--f-h:"Caveat",cursive}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);margin:0;overflow-x:hidden}
button{font:inherit;color:inherit}
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,6,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#05060c;z-index:30}
.topo h1{margin:0 0 10px;font-family:var(--f-d);font-weight:900;font-size:22px}
.topo h1 em{color:var(--accent)}
.abas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.abas button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.abas button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.abas button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.palco{position:relative;min-height:calc(100svh - 110px);overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1d2a52 0%,#0b1022 45%,#05060c 100%)}
.legenda{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:5;padding-inline:16px}
.cab-v{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;z-index:5;max-width:min(420px,80vw);pointer-events:none}
.cab-v b{display:block;font-family:var(--f-d);font-weight:900;font-size:clamp(26px,3.4vw,40px);line-height:1}
.cab-v span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.ceu{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff7,transparent),radial-gradient(1px 1px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 10% 80%,#fff6,transparent),radial-gradient(1px 1px at 55% 45%,#fff5,transparent);background-size:400px 400px;opacity:.7;pointer-events:none}
img{-webkit-user-drag:none;user-select:none}
.peca-img{filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(3,4,10,.92);display:grid;place-items:center;padding:24px}
.zoom[hidden]{display:none}
.zoom-in{display:grid;gap:14px;justify-items:center;max-width:900px;width:100%}
.zoom-imgs{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.zoom-imgs img{max-height:min(62svh,560px);max-width:min(42vw,420px)}
.zoom b{font-family:var(--f-d);font-size:30px}
.zoom button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:600px){.zoom-imgs img{max-width:80vw;max-height:38svh}}

/* 1 varal */
.v1 .corda{position:absolute;left:-5%;right:-5%;height:120px;border-bottom:2px solid rgba(254,250,226,.5);border-radius:0 0 50% 50%;pointer-events:none}
.v1 .pendura{position:absolute;transform-origin:50% 0;animation:balanca 3.6s ease-in-out infinite;cursor:pointer}
.v1 .pendura::before,.v1 .pendura::after{content:"";position:absolute;top:-8px;width:8px;height:22px;background:#c9a27a;border-radius:2px;box-shadow:inset -2px 0 0 #a07a55}
.v1 .pendura::before{left:22%}.v1 .pendura::after{right:22%}
.v1 .virador{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.v1 .pendura.virada .virador{transform:rotateY(180deg)}
.v1 .virador img{display:block;width:100%;backface-visibility:hidden}
.v1 .virador img.c{position:absolute;inset:0;transform:rotateY(180deg)}
@keyframes balanca{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* 2 arara */
.v2 .trilho-a{position:absolute;left:0;right:0;top:22%;height:6px;background:linear-gradient(#cfd3dc,#7d8496);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.v2 .cabides{position:absolute;left:0;top:22%;display:flex;gap:10px;padding:0 40vw;transition:transform .7s cubic-bezier(.2,.9,.3,1)}
.v2 .cab{position:relative;flex:none;width:220px;transform-origin:50% 0;cursor:pointer}
.v2 .cab svg{display:block;width:120px;margin:-14px auto 0;overflow:visible}
.v2 .cab img{display:block;width:100%;margin-top:-6px}
.v2 .cab.ativo{z-index:2}
.v2 .cab.mexe{animation:gira .9s ease-out}
@keyframes gira{0%{transform:rotate(0)}25%{transform:rotate(7deg)}55%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.v2 .setas{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;gap:14px;z-index:4}
.v2 .setas button,.v3 .nav button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;background:rgba(5,6,12,.5)}
/* 3 lookbook */
.v3 .gigante{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-d);font-weight:900;font-style:italic;font-size:clamp(90px,19vw,300px);line-height:.85;color:transparent;-webkit-text-stroke:1.5px rgba(138,196,254,.45);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.v3 .foto{position:absolute;left:50%;top:50%;width:min(470px,80vw);transform:translate(-50%,-48%);transition:transform .6s cubic-bezier(.2,.9,.3,1),opacity .4s;cursor:pointer}
.v3 .foto img{width:100%;display:block}
.v3 .info{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:20px;text-align:right;z-index:4}
.v3 .info .n{font-family:var(--f-m);font-size:12px;color:var(--muted)}
.v3 .info b{display:block;font-family:var(--f-d);font-size:28px}
.v3 .info .lado{all:unset;cursor:pointer;margin-top:8px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid currentColor}
.v3 .nav{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;gap:14px;z-index:4}
/* 4 cartas viram */
.v4 .grade{position:absolute;inset:90px 16px 50px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;align-content:start;padding-bottom:20px}
.v4 .carta{all:unset;display:block;cursor:pointer;aspect-ratio:3/4;perspective:900px}
.v4 .carta .gira{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.v4 .carta:hover .gira,.v4 .carta:focus-visible .gira,.v4 .carta.virada .gira{transform:rotateY(180deg)}
.v4 .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;background:linear-gradient(160deg,#1a2347,#0b1022);box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-rows:1fr auto;padding:10px}
.v4 .face img{width:100%;height:100%;object-fit:contain;min-height:0}
.v4 .face small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-top:6px}
.v4 .face.c{transform:rotateY(180deg);background:linear-gradient(160deg,#283456,#141a30)}
/* 5 pilha que desliza */
.v5 .monte{position:absolute;left:50%;top:50%;width:min(380px,74vw);aspect-ratio:1;transform:translate(-50%,-52%)}
.v5 .folha{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,#fefae2,#e9e3c6);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:18px;display:grid;grid-template-rows:1fr auto;touch-action:none;cursor:grab;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.v5 .folha img{width:100%;height:100%;object-fit:contain;min-height:0}
.v5 .folha small{color:#283456;font-weight:800;font-size:13px;text-align:center;letter-spacing:.06em}
/* 6 vitrine */
.v6 .vidro{position:absolute;inset:80px 4% 70px;border-radius:6px;background:linear-gradient(180deg,#0d1430,#070a18);box-shadow:inset 0 0 0 10px #1b1f2c,inset 0 0 0 11px #3a4054,0 0 80px rgba(138,196,254,.12);overflow:hidden}
.v6 .neon{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-family:var(--f-h);font-size:clamp(40px,6vw,70px);color:#ffd6f3;text-shadow:0 0 6px #ff7ad9,0 0 18px #ff3fc8,0 0 40px #ff3fc8;animation:neon 4s infinite}
@keyframes neon{0%,18%,22%,60%,100%{opacity:1}20%,61%{opacity:.4}}
.v6 .expo{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;align-items:flex-end;gap:2%}
.v6 .expo img{width:22%;max-width:220px;cursor:pointer;transition:transform .3s}
.v6 .expo img:hover{transform:translateY(-8px)}
.v6 .reflexo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 38%,transparent 46%);pointer-events:none}
.v6 .luz{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,200,.22),transparent);pointer-events:none;mix-blend-mode:screen}
/* 7 máquina de lavar */
.v7 .maquina{position:absolute;left:50%;top:50%;width:min(420px,84vw);aspect-ratio:.82;transform:translate(-50%,-50%);border-radius:28px;background:linear-gradient(160deg,#f2efe2,#cfcab4);box-shadow:0 40px 80px -30px #000,inset 0 -8px 0 rgba(0,0,0,.08)}
.v7 .painel{position:absolute;left:8%;right:8%;top:5%;height:12%;display:flex;align-items:center;justify-content:space-between;color:#283456;font-family:var(--f-m);font-size:12px}
.v7 .painel button{all:unset;cursor:pointer;background:#283456;color:#fefae2;border-radius:99px;padding:8px 14px;font-family:var(--f-b);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.v7 .porta{position:absolute;left:50%;top:58%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#bdb7a0;box-shadow:inset 0 0 0 14px #e8e4d4,inset 0 0 0 18px #9d987f}
.v7 .tambor{position:absolute;inset:22px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 35%,#2b3a6b,#0b1022 70%)}
.v7 .tambor .gira{position:absolute;inset:0}
.v7 .tambor img{position:absolute;width:52%;left:24%;top:24%}
.v7 .vidroP{position:absolute;inset:22px;border-radius:50%;background:linear-gradient(130deg,rgba(255,255,255,.35),transparent 40%);pointer-events:none}
/* 8 etiquetas */
.v8 .mural{position:absolute;inset:90px 16px 50px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 16px;align-content:start}
.v8 .item{position:relative;cursor:pointer}
.v8 .item img{width:100%;display:block}
.v8 .tag{position:absolute;right:6%;top:18%;width:96px;padding:10px 8px 8px;background:#fefae2;color:#141a30;border-radius:4px 4px 10px 10px;transform-origin:50% -18px;animation:tag 3s ease-in-out infinite;font-size:10px;line-height:1.3;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.v8 .tag::before{content:"";position:absolute;left:50%;top:-18px;width:1px;height:18px;background:#fefae2}
.v8 .tag::after{content:"";position:absolute;left:50%;top:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#141a30}
.v8 .tag b{display:block;font-family:var(--f-d);font-size:13px;margin-top:6px}
.v8 .tag span{font-family:var(--f-m)}
@keyframes tag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
/* 9 lençol */
.v9 .lencol{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 40%,#3c4b80,#1c2547 70%,#10162e);}
.v9 .lencol::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.03) 0 18px,transparent 18px 46px),repeating-linear-gradient(10deg,rgba(0,0,0,.08) 0 30px,transparent 30px 90px)}
.v9 .solta{position:absolute;width:min(230px,38vw);cursor:grab;touch-action:none;transition:filter .2s}
.v9 .solta.pega{cursor:grabbing;filter:drop-shadow(0 30px 30px rgba(0,0,0,.6));z-index:10}
/* 10 sonhos caindo */
.v10 .cai{position:absolute;top:-30%;cursor:pointer;will-change:transform}
.v10 .cai img{width:100%;display:block}
.v10 .rede{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font-family:var(--f-d);font-style:italic;font-size:clamp(26px,3vw,38px);color:var(--muted);pointer-events:none;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="topo">
  <h1>10 jeitos de mostrar as <em>roupas</em> · escolhe um</h1>
  <div class="abas" id="abas"></div>
</header>
<main class="palco" id="palco"><div class="ceu"></div></main>
<div class="zoom" id="zoom" hidden><div class="zoom-in"><b id="z-nome"></b><div class="zoom-imgs" id="z-imgs"></div><button type="button" id="z-fecha">Fechar</button></div></div>

<script>
const P=[
 {s:"d1",n:"Menino cromado",c:"dreamz",cor:"off-white"},{s:"d2",n:"I'm not broken",c:"dreamz",cor:"vermelha"},{s:"d3",n:"Losing $leep",c:"dreamz",cor:"preta"},{s:"d4",n:"DRZ",c:"dreamz",cor:"preta"},
 {s:"b9",n:"Camiseta BMC",c:"Bross Motors",cor:"preta"},{s:"b1",n:"Camiseta BMC",c:"Bross Motors",cor:"off-white"},{s:"b5",n:"Camiseta BMC",c:"Bross Motors",cor:"azul"},
 {s:"b6",n:"Polo BMC",c:"Bross Motors",cor:"preta"},{s:"b7",n:"Polo BMC",c:"Bross Motors",cor:"off-white"},{s:"b8",n:"Polo BMC",c:"Bross Motors",cor:"azul"},
 {s:"c3",n:"Boné BMC",c:"Bross Motors",cor:"laranja",bone:1},{s:"c1",n:"Boné BMC",c:"Bross Motors",cor:"preto",bone:1},{s:"c2",n:"Boné BMC",c:"Bross Motors",cor:"azul",bone:1},
 {s:"b2",n:"Camiseta BMC",c:"Bross Motors",cor:"off-white"},{s:"b3",n:"Camiseta BMC",c:"Bross Motors",cor:"preta"},{s:"b4",n:"Camiseta BMC",c:"Bross Motors",cor:"azul"}];
const src=(p,l="f")=>`assets/estampas/${p.s}${l}.webp`;
const palco=document.getElementById("palco"), Z=document.getElementById("zoom");
function zoom(p){ document.getElementById("z-nome").textContent=`${p.n} · ${p.cor}`; document.getElementById("z-imgs").innerHTML=(p.bone?["f","l","b"]:["f","b"]).map(l=>`<img src="${src(p,l)}" alt="${p.n}">`).join(""); Z.hidden=false; }
document.getElementById("z-fecha").onclick=()=>Z.hidden=true; Z.onclick=e=>{ if(e.target===Z) Z.hidden=true; };
let parar=[];
const cab=(t,s)=>`<div class="cab-v"><b>${t}</b><span>${s}</span></div>`;
const V={
 "1 · Varal":()=>{ palco.className="palco v1"; const L=P.slice(0,8); const w=Math.min(190,innerWidth/4.3);
   palco.insertAdjacentHTML("beforeend",cab("Varal da madrugada","As roupas secando no céu. Toque pra virar.")+`<div class="corda" style="top:28%"></div>`);
   L.forEach((p,i)=>{ const x=(i+.5)/L.length*100, y=28+Math.sin((i+.5)/L.length*Math.PI)*13; palco.insertAdjacentHTML("beforeend",`<div class="pendura" style="left:calc(${x}% - ${w/2}px);top:calc(${y}% + 96px);width:${w}px;animation-delay:${-i*.5}s"><div class="virador"><img src="${src(p)}" alt="${p.n}"><img class="c" src="${src(p,"b")}" alt=""></div></div>`); });
   palco.querySelectorAll(".pendura").forEach(el=>el.onclick=()=>el.classList.toggle("virada")); },
 "2 · Arara":()=>{ palco.className="palco v2"; let i=0;
   palco.insertAdjacentHTML("beforeend",cab("Arara da loja","Passe as peças no trilho, como numa loja.")+`<div class="trilho-a"></div><div class="cabides" id="cabs">${P.filter(p=>!p.bone).map(p=>`<div class="cab"><svg viewBox="0 0 120 60"><path d="M60 30 L60 14 A9 9 0 1 1 69 5" fill="none" stroke="#cfd3dc" stroke-width="3"/><path d="M60 30 L8 56 H112 Z" fill="none" stroke="#cfd3dc" stroke-width="3" stroke-linejoin="round"/></svg><img src="${src(p)}" alt="${p.n}"></div>`).join("")}</div><div class="setas"><button id="ant">←</button><button id="prox">→</button></div>`);
   const cs=[...palco.querySelectorAll(".cab")], wrap=document.getElementById("cabs");
   const vai=d=>{ i=Math.max(0,Math.min(cs.length-1,i+d)); wrap.style.transform=`translateX(${-i*230-110}px)`; cs.forEach((c,k)=>{ c.classList.toggle("ativo",k===i); c.classList.remove("mexe"); void c.offsetWidth; if(Math.abs(k-i)<=2) c.classList.add("mexe"); }); };
   document.getElementById("ant").onclick=()=>vai(-1); document.getElementById("prox").onclick=()=>vai(1);
   cs.forEach((c,k)=>c.onclick=()=>k===i?zoom(P.filter(p=>!p.bone)[k]):vai(k-i)); vai(0); },
 "3 · Lookbook":()=>{ palco.className="palco v3"; let i=0, lado="f";
   palco.insertAdjacentHTML("beforeend",`<div class="gigante" id="gig"></div><div class="foto" id="foto"><img id="fimg" alt=""></div><div class="info"><span class="n" id="num"></span><b id="nome"></b><span class="muted" id="col" style="font-size:13px;color:var(--muted)"></span><br><button class="lado" id="lado">ver costas</button></div><div class="nav"><button id="ant">←</button><button id="prox">→</button></div>`);
   const mostra=()=>{ const p=P[i]; document.getElementById("gig").textContent=p.c==="dreamz"?"dreamz":"BMC"; document.getElementById("fimg").src=src(p,lado); document.getElementById("num").textContent=`${String(i+1).padStart(2,"0")} / ${P.length}`; document.getElementById("nome").textContent=p.n; document.getElementById("col").textContent=`${p.c} · ${p.cor}`; document.getElementById("lado").textContent=lado==="f"?"ver costas":"ver frente"; };
   const vai=d=>{ const f=document.getElementById("foto"); f.style.transform=`translate(${d>0?-80:-20}%,-48%)`; f.style.opacity=0; setTimeout(()=>{ i=(i+d+P.length)%P.length; lado="f"; mostra(); f.style.transition="none"; f.style.transform=`translate(${d>0?-20:-80}%,-48%)`; void f.offsetWidth; f.style.transition=""; f.style.transform="translate(-50%,-48%)"; f.style.opacity=1; },350); };
   document.getElementById("ant").onclick=()=>vai(-1); document.getElementById("prox").onclick=()=>vai(1);
   document.getElementById("lado").onclick=()=>{ lado=lado==="f"?"b":"f"; mostra(); }; document.getElementById("foto").onclick=()=>{ lado=lado==="f"?"b":"f"; mostra(); }; mostra(); },
 "4 · Cartas":()=>{ palco.className="palco v4";
   palco.insertAdjacentHTML("beforeend",cab("Cartas que viram","Passe o mouse ou toque: a carta vira e mostra as costas.")+`<div class="grade">${P.map((p,k)=>`<button class="carta" data-k="${k}"><span class="gira"><span class="face"><img src="${src(p)}" alt="${p.n}"><small>${p.n} · ${p.cor}</small></span><span class="face c"><img src="${src(p,p.bone?"l":"b")}" alt=""><small>${p.bone?"lateral":"costas"}</small></span></span></button>`).join("")}</div>`);
   palco.querySelectorAll(".carta").forEach(c=>c.onclick=()=>c.classList.toggle("virada")); },
 "5 · Monte":()=>{ palco.className="palco v5"; let ordem=P.map((_,k)=>k);
   palco.insertAdjacentHTML("beforeend",cab("Monte de roupa","Arraste a de cima pro lado pra ver a próxima.")+`<div class="monte" id="monte"></div>`);
   const monte=document.getElementById("monte");
   const desenha=()=>{ monte.innerHTML=ordem.slice(0,4).reverse().map((k,j,a)=>{ const d=a.length-1-j; return `<div class="folha" data-k="${k}" style="transform:translateY(${d*12}px) scale(${1-d*.05}) rotate(${(k%3-1)*2}deg);z-index:${10-d}"><img src="${src(P[k])}" alt="${P[k].n}"><small>${P[k].n} · ${P[k].cor}</small></div>`; }).join(""); liga(); };
   const liga=()=>{ const top=monte.lastElementChild; let x0=null,dx=0;
     top.onpointerdown=e=>{ x0=e.clientX; top.setPointerCapture(e.pointerId); top.style.transition="none"; };
